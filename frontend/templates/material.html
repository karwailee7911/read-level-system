<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/app.js"></script>
</head>
<body>
  <main class="shell wide">
    <nav class="nav">
      <a class="brand" href="/">Read Level System</a>
      <div>
        <a href="/materials">资料库</a>
        <a href="/import">导入资料</a>
        <a href="/writing">写作</a>
      </div>
    </nav>
    {{ message }}

    <section class="material-title">
      <span>{{ type }} · {{ imported_at }}</span>
      <h1>{{ title }}</h1>
      <form method="post" action="/api/materials/{{ id }}/delete" onsubmit="return confirm('确定删除这份资料？此操作不可恢复。');">
        <button type="submit">删除此资料</button>
      </form>
    </section>

    <section class="workspace">
      <aside class="source-panel">
        <div class="section-head">
          <h2>原文</h2>
        </div>
        <article class="source-body">
          {{ source_html }}
        </article>
      </aside>

      <section class="editor-panel">
        <div class="section-head">
          <h2>写</h2>
        </div>

        <section class="editor-card single-editor">
          <form method="post" action="/api/materials/{{ id }}/capture">
            <textarea name="content" rows="12" placeholder="直接写。"></textarea>
            <button type="submit">保存</button>
          </form>
        </section>

        <section class="saved-panel">
          <div class="section-head">
            <h2>已归档</h2>
          </div>
          {{ saved_preview }}
        </section>
      </section>
    </section>
  </main>
</body>
</html>
