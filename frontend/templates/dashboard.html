<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人读书经验系统</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <nav class="nav">
      <a class="brand" href="/">Read Level System</a>
      <div>
        <a href="/import">导入资料</a>
        <a href="/materials">资料库</a>
        <a href="/writing">写作</a>
        <a href="/settings">目标设置</a>
      </div>
    </nav>

    {{ message }}

    <section class="hero">
      <span class="eyebrow">当前目标</span>
      <h1>{{ goal }}</h1>
    </section>

    <section class="grid two">
      <article class="panel focus">
        <div class="panel-head">
          <span>{{ state_label }}</span>
        </div>
        <h2>{{ weak_ability }}</h2>
        <p>{{ reason }}</p>
        <div class="next-task">
          <strong>下一步</strong>
          <span>{{ next_task }}</span>
        </div>
        <div class="actions">
          <a class="button primary" href="/import">导入资料</a>
          <a class="button" href="/materials">打开资料库</a>
          <form method="post" action="/api/score/rebuild">
            <button type="submit">刷新判断</button>
          </form>
        </div>
      </article>

      <aside class="panel">
        <h2>判断依据</h2>
        {{ evidence_html }}
      </aside>
    </section>

    <section class="grid two">
      <article class="panel">
        <h2>四维能力</h2>
        {{ ability_rows }}
      </article>
      <article class="panel">
        <h2>最近处理</h2>
        {{ recent_materials }}
      </article>
    </section>
  </main>
</body>
</html>
