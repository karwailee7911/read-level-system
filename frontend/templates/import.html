<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>导入资料</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <nav class="nav">
      <a class="brand" href="/">Read Level System</a>
      <div>
        <a href="/materials">资料库</a>
        <a href="/writing">写作</a>
        <a href="/settings">目标设置</a>
      </div>
    </nav>

    {{ message }}

    <section class="hero compact">
      <span class="eyebrow">导入资料</span>
      <h1>把资料放进来。</h1>
    </section>

    <section class="grid two">
      <article class="panel">
        <h2>上传 PDF</h2>
        {{ pdf_note }}
        <form method="post" action="/api/import/pdf" enctype="multipart/form-data" class="form">
          <label>标题</label>
          <input name="title" type="text" placeholder="可不填">
          <label>PDF 文件</label>
          <input name="file" type="file" accept=".pdf" required>
          <button type="submit">导入 PDF</button>
        </form>
      </article>

      <article class="panel">
        <h2>上传公众号文章</h2>
        <form method="post" action="/api/import/article" enctype="multipart/form-data" class="form">
          <label>标题</label>
          <input name="title" type="text" placeholder="可不填">
          <label>Markdown 或 txt 文件</label>
          <input name="file" type="file" accept=".md,.txt" required>
          <button type="submit">导入文章</button>
        </form>
      </article>
    </section>

    <section class="panel">
      <h2>直接粘贴文章</h2>
      <form method="post" action="/api/import/article-text" class="form">
        <label>标题</label>
        <input name="title" type="text" placeholder="可不填">
        <label>文章内容</label>
        <textarea name="content" rows="14" placeholder="粘贴正文" required></textarea>
        <button type="submit">导入</button>
      </form>
    </section>
  </main>
</body>
</html>
