<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>写作</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <nav class="nav">
      <a class="brand" href="/">Read Level System</a>
      <div>
        <a href="/import">导入资料</a>
        <a href="/materials">资料库</a>
        <a href="/settings">目标设置</a>
      </div>
    </nav>
    {{ message }}
    <section class="hero compact">
      <span class="eyebrow">写作</span>
      <h1>这里写不绑定某一份资料的草稿。</h1>
      <p>如果草稿来自某份资料，建议去那份资料的处理页写。</p>
    </section>
    <section class="panel">
      <form method="post" action="/api/writing/inbox" class="form">
        <label>草稿 inbox.md</label>
        <textarea name="content" rows="18" placeholder="写一个临时草稿。">{{ draft }}</textarea>
        <button type="submit">保存草稿</button>
      </form>
    </section>
  </main>
</body>
</html>
